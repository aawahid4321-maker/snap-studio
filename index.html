<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        var isGh = window.location.hostname.endsWith("github.io") || window.location.pathname.startsWith("/snap-studio");
        var base = isGh ? "/snap-studio" : "";

        function fixUrl(url) {
          if (!url || typeof url !== "string") return url;
          if (!base) return url;
          var prefixes = ["/work/", "/images/", "/avatars/", "/social-media/"];
          for (var i = 0; i < prefixes.length; i++) {
            var p = prefixes[i];
            if (url.startsWith(p)) {
              return base + url;
            }
            if (url.startsWith(p.slice(1))) {
              return base + "/" + url;
            }
            var originPref = window.location.origin + p;
            if (url.startsWith(originPref)) {
              return window.location.origin + base + p + url.slice(originPref.length);
            }
          }
          return url;
        }

        window.__SNAP_FIX_URL__ = fixUrl;

        var imgProto = HTMLImageElement.prototype;
        var srcDesc = Object.getOwnPropertyDescriptor(imgProto, "src");
        if (srcDesc && srcDesc.set) {
          var origSet = srcDesc.set;
          Object.defineProperty(imgProto, "src", {
            set: function(val) {
              origSet.call(this, fixUrl(val));
            },
            get: srcDesc.get,
            configurable: true,
            enumerable: true
          });
        }

        var origSetAttr = Element.prototype.setAttribute;
        Element.prototype.setAttribute = function(name, val) {
          if (name === "src" || name === "href") {
            return origSetAttr.call(this, name, fixUrl(val));
          }
          return origSetAttr.call(this, name, val);
        };

        if (window.fetch) {
          var origFetch = window.fetch;
          window.fetch = function(input, init) {
            if (typeof input === "string") {
              input = fixUrl(input);
            } else if (input && typeof input.url === "string") {
              input = new Request(fixUrl(input.url), input);
            }
            return origFetch.call(this, input, init);
          };
        }
      })();
    </script>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title><!-- figma:title --></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Geist:wght@100..900&family=Geist+Mono:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Critical image preloads for instant above-the-fold hero rendering -->
    <link
      rel="preload"
      as="image"
      href="./images/snap-logo-scroll/snap-logo-glass-scroll_0001.webp"
      type="image/webp"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="./images/logo-emblem.png"
      type="image/png"
    />
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
